name: self-test

# The promises in README.md are assertions here. No model key, no network, nothing to pay:
# a fork can run this and get the same numbers the Platform tab shows.

on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * *'   # mirrors the nightly oversight self-test, at the same hour

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: self-test (classifier, scenarios, canary, decision semantics, guard vectors)
        run: node tests/run.js
      - name: boot the app and check it answers
        run: |
          PORT=3999 node server.js & pid=$!
          for i in $(seq 1 30); do
            sleep 1
            curl -fsS http://localhost:3999/health > /tmp/health.json && break
          done
          cat /tmp/health.json
          echo "a CI host has no model key, as expected:"
          curl -fsS http://localhost:3999/api/voice | head -c 200
          kill $pid
      - name: the brief must be honest about which voice wrote it
        run: |
          PORT=3999 node server.js & pid=$!
          for i in $(seq 1 30); do sleep 1; curl -fsS http://localhost:3999/api/brief -o /tmp/brief.json && break; done
          node -e '
            const b = JSON.parse(require("fs").readFileSync("/tmp/brief.json","utf8")).brief;
            const line = b.text.split("\n").find(l => l.startsWith("Wording:"));
            if (!line) { console.error("no wording line"); process.exit(1); }
            const v = b.voice;
            console.log("CI:", line.slice(0, 150));
            console.log("   voice:", JSON.stringify({used:v.used,total:v.total,live:v.live_on_this_host,cred:v.this_host_credential||null}));
            // the assertion is about consistency with the data, not about a magic phrase
            if (v.used > 0 && !/phrased here/.test(line)) { console.error("line claims no generation but voice says", v.used); process.exit(1); }
            if (v.used === 0 && !/no model call on this host/.test(line)) { console.error("line does not admit that nothing was generated here"); process.exit(1); }
            if (v.used === 0 && v.total !== 10) { console.error("total should be the phrasable count, got", v.total); process.exit(1); }
          '
          kill $pid
