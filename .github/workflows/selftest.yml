name: self-test

# The promises in README.md are assertions here. Two lanes on purpose:
#   unit   — pure Node, offline, no key, nothing to pay
#   live   — boots the real app once and asserts what the API actually returns
# GitHub runners have 2 cores and no model credential, which is exactly the
# degraded configuration the app claims to handle honestly. So CI verifies that claim.

on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * *'   # mirrors the nightly oversight self-test, same hour

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 'self-test — classifier, scenarios, canary, decision semantics, guard vectors, integrity'
        run: node tests/run.js

      - name: 'rulebook report — policy.json is the source, drift is caught, chain verifies'
        run: |
          node scripts/integrity.js
          node scripts/integrity-chain.js

      - name: 'integration — boot the real app once and assert live behaviour'
        env:
          PORT: '3999'
        run: |
          set -euo pipefail
          node server.js >/tmp/app.log 2>&1 &
          pid=$!
          cleanup() {
            kill $pid 2>/dev/null || true
            wait $pid 2>/dev/null || true
          }
          trap cleanup EXIT

          # On boot this app replays the whole night: 18 gate decisions, the ten
          # scenario runs, the canary and the audit chain. On a 2-core runner that
          # is not instant, so we poll for readiness instead of assuming a sleep.
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS -m 3 "http://127.0.0.1:${PORT}/health" -o /tmp/health.json 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "::error::server never became healthy within 60s"
            sed -n '1,120p' /tmp/app.log
            exit 1
          fi
          echo "health: $(cat /tmp/health.json)"

          code=$(curl -s -o /tmp/brief.json -w '%{http_code}' -m 40 "http://127.0.0.1:${PORT}/api/brief")
          if [ "$code" != 200 ]; then
            echo "::error::GET /api/brief returned HTTP $code"
            sed -n '1,120p' /tmp/app.log
            exit 1
          fi
          [ -s /tmp/brief.json ] || { echo "::error::/api/brief returned an empty body"; exit 1; }

          curl -fsS -m 40 "http://127.0.0.1:${PORT}/api/integrity" -o /tmp/integrity.json
          curl -fsS -m 40 "http://127.0.0.1:${PORT}/api/voice"     -o /tmp/voice.json
          curl -fsS -m 40 "http://127.0.0.1:${PORT}/api/store"      -o /tmp/store.json

          node -e '
          (async () => {
            const fs = require("fs");
            const read = (f) => JSON.parse(fs.readFileSync(f, "utf8"));
            const doc = read("/tmp/brief.json");          // text is a sibling of brief in the response
            const b = doc.brief;
            const ig = read("/tmp/integrity.json");
            const vo = read("/tmp/voice.json");
            const so = read("/tmp/store.json");
            const v = b.voice || {};
            const nl = String.fromCharCode(10);
            const line = (doc.text || "").split(nl).find((l) => l.startsWith("Wording:"));
            const fail = (m) => { console.error("FAIL: " + m); process.exit(1); };

            console.log("wording line  :", line || "(none)");
            console.log("voice         :", JSON.stringify({ used: v.used, total: v.total, live: v.live_on_this_host, cred: v.this_host_credential || null }));
            console.log("model avail   :", vo.available, "| drift:", JSON.stringify((ig.report || {}).drifted), "| R10 limit:", ig.limits && ig.limits.payStanding);

            // the wording paragraph must describe what the data says, in either mode
            if (!line) fail("no Wording: line in the returned brief text");
            if (v.used > 0 && !/phrased here/.test(line)) fail("voice.used=" + v.used + " but the line hides that a model wrote it");
            if (!v.used && !/no model call on this host/.test(line)) fail("nothing was generated on this host and the line does not admit it");

            // the database mirror: what a judge is told is true, checked against the trail
            if (!so || !so.store) fail("no /api/store block returned");
            if (so.store.ok) {
              if (so.store.rows !== so.snapshot.entries)
                fail("SQLite holds " + so.store.rows + " rows but the trail has " + so.snapshot.entries);
              if (so.store.queued !== so.snapshot.queue)
                fail("SQLite queue rows " + so.store.queued + " vs app queue " + so.snapshot.queue);
              console.log("store         : sqlite mirror", so.store.rows, "rows /", so.store.queued, "queued");
            } else {
              console.log("note: no node:sqlite on this runner; the app served the JSON snapshot and said why:", so.store.reason);
            }

            // total counts the phrasable items, not all ledger rows
            if (v.total !== 10) fail("voice.total should be the 10 phrasable actions, got " + v.total);

            // headline product claims, evaluated live rather than asserted in docs
            if (!b.counts || b.counts.dataLeft !== 0) fail("records that left the studio should be 0");
            if (!b.classifier || b.classifier.correct !== b.classifier.total) fail("classifier regressed: " + JSON.stringify(b.classifier));
            if (!b.selfTest || b.selfTest.points !== b.selfTest.max) fail("scenario board regressed: " + JSON.stringify(b.selfTest && { got: b.selfTest.points, of: b.selfTest.max }));
            if (!b.guard || (b.guard.claims_data_left || 0) !== 0) fail("published prose contains an unnegated leak claim: " + JSON.stringify(b.guard));

            // rulebook integrity
            if (((ig.report || {}).drifted || []).length) fail("rulebook drift on a clean checkout: " + ig.report.drifted.join(", "));
            if (!ig.policy_sha) fail("no rulebook hash published");
            if (!ig.limits || ig.limits.payStanding !== 1000) fail("R10 limit was not read from policy.json: " + JSON.stringify(ig.limits));
            if ((b.items || []).some((r) => !r.policy_sha)) fail("some decisions carry no rulebook hash");

            // a live gate call must reach the right verdict with no model involved
            const g = await fetch("http://127.0.0.1:" + process.env.PORT + "/api/gate", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                actor: "marketing", action: "upload_to_external_tool", file: "admin/client_list.csv",
                files: ["admin/client_list.csv"], target: "sparkmail.example", scope: ["admin/client_list.csv"],
              }),
            }).then((r) => r.json());
            if (!g.entry) fail("gate call returned no entry: " + JSON.stringify(g).slice(0, 200));
            if (g.entry.decision !== "BLOCK") fail("the client-list upload was not blocked: " + g.entry.decision);
            if (!g.entry.policy_sha) fail("live decision carries no rulebook hash");
            console.log("live gate     :", g.entry.decision, g.entry.rules.map((h) => h.id).join(","), "under rulebook " + g.entry.policy_sha);

            if (!vo.available) console.log("note: CI is keyless; the app reported that instead of implying a model ran");
            console.log("integration OK");
          })().catch((e) => { console.error("FAIL: " + (e && e.message)); process.exit(1); });
          '

      # The abuse lane. Four things a public, unauthenticated demo host must not be talked into:
      # recording a row for an action nobody asked about, serving a file outside public/, answering
      # HEAD with a length that disagrees with GET, and growing an append-only audit trail until the
      # disk is gone. The last is answered by refusing new live-gate rows, never by deleting
      # history - so the test also asserts the seeded night is still there and the chain verifies.
      - name: 'abuse lane — malformed asks, traversal, HEAD parity, ledger cap, chain intact'
        env:
          OVERSIGHT_DATA_DIR: /tmp/abuse-data
          OVERSIGHT_CRED_FILE: /nonexistent-cred-in-ci
        run: |
          set -euo pipefail
          mkdir -p /tmp/abuse-data
          PORT=3123 HOST=127.0.0.1 node server.js > /tmp/abuse.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ready=no
          for i in $(seq 1 60); do
            if curl -sf -m 3 "http://127.0.0.1:3123/healthz" >/dev/null; then ready=yes; break; fi
            sleep 1
          done
          [ "$ready" = yes ] || { echo "::error::app did not answer /healthz"; sed -n '1,80p' /tmp/abuse.log; exit 1; }
          B=http://127.0.0.1:3123
          ASK='{"actor":"sales","action":"send_email","to":"someone@outside.example","files":[],"body":"SGD 9,999 please"}'

          code=$(curl -s -o /tmp/a1.json -w '%{http_code}' -X POST "$B/api/gate" -H 'content-type: application/json' -d '[1,2,3]')
          [ "$code" = 400 ] || { echo "::error::array body returned $code"; exit 1; }
          code=$(curl -s -o /tmp/a2.json -w '%{http_code}' -X POST "$B/api/gate" -H 'content-type: application/json' -d '{"actor":"sales"}')
          [ "$code" = 400 ] || { echo "::error::actionless body returned $code"; exit 1; }
          echo "malformed asks refused with 400 (no audit row minted for an action nobody asked about)"

          for u in "/%2e%2e/%2e%2e/server.js" "/..%2fserver.js" "/../server.js"; do
            c=$(curl -s --path-as-is -o /tmp/a3.txt -w '%{http_code}' "$B$u")
            if grep -q "createServer" /tmp/a3.txt; then echo "::error::leaked source via $u"; exit 1; fi
            [ "$c" != 200 ] || { echo "::error::served $u"; exit 1; }
          done
          echo "nothing outside public/ is served"

          gl=$(curl -s -o /dev/null -w '%{size_download}' "$B/")
          hl=$(curl -s -I "$B/" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}')
          [ "$hl" = "$gl" ] || { echo "::error::HEAD content-length $hl != GET body $gl"; exit 1; }
          echo "HEAD is bodyless and agrees with GET on length ($gl bytes)"

          refused=no
          for i in $(seq 1 46); do
            c=$(curl -s -o /tmp/a4.json -w '%{http_code}' -X POST "$B/api/gate" -H 'content-type: application/json' -d "$ASK")
            if [ "$c" = 429 ]; then refused=yes; break; fi
          done
          [ "$refused" = yes ] || { echo "::error::the live-gate ledger grew past its cap without refusing"; exit 1; }
          grep -q "Nothing was deleted" /tmp/a4.json || { echo "::error::the refusal does not state that history was kept"; exit 1; }
          echo "live-gate rows capped; refusal states nothing was deleted"

          curl -s "$B/api/store" -o /tmp/a6.json
          curl -s "$B/api/integrity" -o /tmp/a5.json
          node -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/a5.json", "utf8"));
            const fail = (m) => { console.error("FAIL: " + m); process.exit(1); };
            if (d.chain.state !== "VERIFIED") fail("chain after a write storm: " + d.chain.state);
            if (d.chain.rows !== d.chain.entries) fail("chain coverage drifted: " + d.chain.rows + " rows vs " + d.chain.entries + " entries");
            if (!d.policy_sha) fail("no rulebook hash reported");
            const s6 = JSON.parse(require("fs").readFileSync("/tmp/a6.json", "utf8"));
            if (s6.store.ok && s6.store.rows !== s6.snapshot.entries) fail("database mirror drifted after the write storm: " + s6.store.rows + " vs " + s6.snapshot.entries);
            if (s6.store.ok) console.log("  mirror after the storm:", s6.store.rows, "rows,", s6.store.queued, "queued,", JSON.stringify(s6.store.queries[4].rows));
            console.log("chain still VERIFIED over", d.chain.rows, "rows, under rulebook", d.policy_sha);
          '

          curl -s -X POST "$B/api/night/run" -o /dev/null
          left=$(curl -s "$B/healthz" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>console.log(JSON.parse(s).entries))')
          [ "$left" = 18 ] || { echo "::error::replay should restore the seeded 18 rows, found $left"; exit 1; }
          echo "Replay the night clears demo rows and keeps the audit trail"
